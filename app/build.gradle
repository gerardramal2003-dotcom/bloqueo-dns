plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gerard.bloqueodns'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gerard.bloqueodns'
        minSdk 29          // Android 10 o superior
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Firma fija: así las futuras versiones se instalan encima sin desinstalar.
    signingConfigs {
        fija {
            storeFile file('bloqueo.jks')
            storePassword 'bloqueodns'
            keyAlias 'bloqueo'
            keyPassword 'bloqueodns'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
