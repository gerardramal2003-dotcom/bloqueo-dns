plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gerard.bloqueodns'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gerard.bloqueodns'
        minSdk 29          // Android 10 o superior
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
